[package]
name = "astra-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "UNLICENSED"
description = "Astra CLI (opencode parity): subcommand surface over the astra daemon gRPC services."

[[bin]]
name = "astra"
path = "src/main.rs"

[dependencies]
astra-proto = { path = "../astra-engine-rust/crates/astra-proto" }
clap = { version = "4", features = ["derive", "env"] }
tonic = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "io-std", "fs", "sync"] }
anyhow = "1"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.4"
futures = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-stream = "0.1"

[dev-dependencies]
hyper = "1"
